listen: :8080

# 选择当前使用的 provider
active: jdcloud

# Token 用量统计数据库路径（SQLite），留空则禁用统计
stats_db: ./data/stats.db
# 统计页面使用 HTTP Basic Auth，用户名固定为 admin
# 对外提供服务前请修改默认密码
stats_password: statspwd123456

providers:
  jdcloud:
    upstream: https://modelservice.jdcloud.com/coding/anthropic
    vision:
      enabled: true
      # 直接发送给上游，不使用 Claude Code 的 sonnet/haiku/opus 别名映射
      model: Kimi-K2.5
    overload_rules:
      - status: 400
        body_contains: "overloaded"
        max_retries: 10
        delay: 2s
        jitter: 1s
      - status: 400
        body_contains: "Too many requests"
        max_retries: 10
        delay: 2s
        jitter: 1s
      - status: 400
        body_contains: "未找到"
        max_retries: 10
        delay: 2s
        jitter: 1s

  # 自定义 provider 示例，取消注释并按需修改：
  # custom:
  #   upstream: https://your-anthropic-compatible-endpoint.com
  #   # protocol 用于 token 统计时的响应解析，支持 anthropic（默认）/ openai
  #   protocol: anthropic
  #   vision:
  #     enabled: false
  #     model: sonnet
  #     max_tokens: 2048
