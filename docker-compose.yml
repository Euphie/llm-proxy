version: '3'
services:
  anthropic-proxy:
    build: .
    restart: unless-stopped
    ports:
      - "${HOST:-127.0.0.1}:${PORT}:8080"
    volumes:
      - type: bind
        source: ${CONFIG_FILE:-./config.yaml}
        target: /app/config.yaml
        read_only: true
      - ./data:/app/data
    environment:
      CONFIG_FILE: /app/config.yaml
