name: llm-proxy

services:
  llm-proxy:
    build: .
    restart: unless-stopped
    ports:
      - "${HOST:-127.0.0.1}:${PORT:-8087}:8080"
    volumes:
      - type: bind
        source: ${DATA_DIR:-./data}
        target: /app/data
    environment:
      LISTEN: :8080
      DATA_DIR: /app/data
      LOG_LEVEL: ${LOG_LEVEL:-info}
